<!doctype html>
<html lang="vi">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Gallery ảnh Responsive</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>Bộ Sưu Tập Ảnh Responsive</h1>

        loại màn hình.
      </p>
    </header>

    <main class="gallery">

      <div class="gallery-item">
        <img src="https://picsum.photos/400/300?random=2" alt="Ảnh 2" />

      <div class="gallery-item">
        <img src="https://picsum.photos/400/300?random=3" alt="Ảnh 3" />

      </div>
      <div class="gallery-item">
        <img src="https://picsum.photos/400/300?random=4" alt="Ảnh 4" />

      </div>
      <div class="gallery-item">
        <img src="https://picsum.photos/400/300?random=5" alt="Ảnh 5" />

      <div class="gallery-item">

      </div>
      <div class="gallery-item">
        <img src="https://picsum.photos/400/300?random=7" alt="Ảnh 7" />
        <div class="desc">Mô tả ảnh 7</div>
      </div>
      <div class="gallery-item">
        <img src="https://picsum.photos/400/300?random=8" alt="Ảnh 8" />
        <div class="desc">Mô tả ảnh 8</div>
      </div>
    </main>

    <footer>
      <p>&copy; 2026 CodeGym Practice - RWD Gallery</p>
    </footer>

</html>
